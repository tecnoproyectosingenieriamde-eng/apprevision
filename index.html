<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Terreno - AaaS</title>
    <link rel="manifest" href="manifest.json">
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
    <!-- Pantalla de Login -->
    <div id="login-screen" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10 border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Acceso Técnicos</h2>
        <input type="text" id="user" placeholder="Usuario" class="w-full p-3 border border-gray-300 mb-4 rounded focus:outline-none focus:border-blue-500">
        <input type="password" id="pass" placeholder="Contraseña" class="w-full p-3 border border-gray-300 mb-6 rounded focus:outline-none focus:border-blue-500">
        <button onclick="login()" class="w-full bg-blue-600 text-white font-bold p-3 rounded hover:bg-blue-700 transition">Ingresar</button>
    </div>

    <!-- Pantalla de Captura de Postes -->
    <div id="app-screen" class="hidden max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-4 border-t-4 border-green-500">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">Inspección de Nodo</h2>
            <span id="status-indicator" class="text-xs px-2 py-1 font-bold bg-red-500 text-white rounded">Offline</span>
        </div>
        
        <label class="block text-sm font-medium text-gray-700 mb-1">ID Código QR</label>
        <input type="text" id="id_poste" placeholder="Ej: TRN-LED-0001" class="w-full p-3 border border-gray-300 mb-4 rounded bg-gray-50 uppercase">
        
        <button onclick="captureGPS()" class="w-full bg-blue-50 border border-blue-200 text-blue-800 font-semibold p-3 rounded mb-2 hover:bg-blue-100 transition">📍 Capturar Coordenada GPS</button>
        <p id="gps-data" class="text-xs text-center text-gray-500 mb-4 h-4"></p>
        
        <label class="block text-sm font-medium text-gray-700 mb-1">Evidencia Fotográfica (Obligatorio)</label>
        <input type="file" accept="image/*" capture="environment" id="cameraInput" class="w-full border border-gray-300 p-2 rounded mb-6 bg-gray-50">
        
        <button onclick="saveRecord()" class="w-full bg-green-600 text-white font-bold p-4 rounded hover:bg-green-700 shadow-lg transition">Guardar Inspección</button>
        
        <button onclick="syncData()" id="btn-sync" class="hidden w-full bg-yellow-500 text-white font-bold p-3 rounded mt-6 shadow hover:bg-yellow-600 transition">
            Sincronizar Pendientes (<span id="queue-count">0</span>)
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
